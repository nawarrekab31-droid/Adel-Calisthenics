<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام خطط الكاليستوينكس الاحترافي</title>
  <link rel="stylesheet" href="style.css?v=2">
  <!-- خط تاجاول العصري -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <!-- رأس الصفحة -->
    <header class="app-header">
      <h1>⚡ نظام خطط الكاليستوينكس الاحترافي</h1>
      <p id="connectionStatus" class="status-online">🟢 متصل بالنظام المحلي السريع</p>
    </header>

    <!-- مشغل الموسيقى الاختياري -->
    <div class="music-control-panel" style="margin-bottom: 20px; text-align: center;">
      <audio id="bgMusic" loop src="https://www.bensound.com/bensound-music/bensound-dubstep.mp3"></audio>
      <button onclick="toggleBackgroundMusic()" id="musicBtn" style="background: rgba(30,41,59,0.8); color: #38bdf8; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: inherit;">
        🎵 <span id="musicText">تشغيل الموسيقى</span>
      </button>
    </div>

    <!-- نموذج إدخال بيانات المتدرب والمهارات -->
    <div class="form-card">
      <h2>👤 البيانات الشخصية والبدنية</h2>
      
      <div class="input-group">
        <label for="clientName">اسم المتدرب / العميل:</label>
        <input type="text" id="clientName" placeholder="أدخل اسم العميل">
      </div>

      <div class="input-row-3">
        <div class="input-group">
          <label for="clientAge">العمر (سنة):</label>
          <input type="number" id="clientAge" value="20">
        </div>
        <div class="input-group">
          <label for="clientWeight">الوزن (كغم):</label>
          <input type="number" id="clientWeight" value="70">
        </div>
        <div class="input-group">
          <label for="clientHeight">الطول (سم):</label>
          <input type="number" id="clientHeight" value="170">
        </div>
      </div>

      <h2 style="margin-top: 25px;">🎯 اختيار المهارة المستهدفة</h2>
      
      <div class="input-group">
        <label for="targetSkill">المهارة الأساسية:</label>
        <select id="targetSkill">
          <option value="handstand">هاندستاند (Handstand)</option>
          <option value="parallel_hold">ثبات المتوازي (L-Sit)</option>
          <option value="other">مهارة أخرى</option>
        </select>
      </div>

      <!-- خانة كتابة مهارة مخصصة جديدة -->
      <div class="input-group">
        <label for="customSkillName" style="color: var(--primary-color);">أو اكتب اسم مهارة مخصصة جديدة:</label>
        <input type="text" id="customSkillName" placeholder="مثال: Planche, Front Lever...">
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="skillHoldTime">زمن الثبات الحالي (ثواني):</label>
          <input type="number" id="skillHoldTime" value="0">
        </div>
        <div class="input-group">
          <label for="skillReps">أقصى عدات/محاولات للمهارة:</label>
          <input type="number" id="skillReps" value="0">
        </div>
      </div>

      <h2 style="margin-top: 25px;">💪 اختبارات القوة البدنية (Strength Tests)</h2>
      
      <div class="input-row">
        <div class="input-group">
          <label for="pullups">العقلة / الثابت (أقصى عدد):</label>
          <input type="number" id="pullups" value="0">
        </div>
        <div class="input-group">
          <label for="dips">المتوازي (أقصى عدد):</label>
          <input type="number" id="dips" value="0">
        </div>
        <div class="input-group">
          <label for="pushups">الضغط (أقصى عدد):</label>
          <input type="number" id="pushups" value="0">
        </div>
        <div class="input-group">
          <label for="squats">السكوات (أقصى عدد):</label>
          <input type="number" id="squats" value="0">
        </div>
        <div class="input-group">
          <label for="plank">البلانك (ثواني):</label>
          <input type="number" id="plank" value="0">
        </div>
        <div class="input-group">
          <label for="hollow">هولو بودي (ثواني):</label>
          <input type="number" id="hollow" value="0">
        </div>
        <div class="input-group">
          <label for="superman">سوبرمان (ثواني):</label>
          <input type="number" id="superman" value="0">
        </div>
        <div class="input-group">
          <label for="hang">التعلق المباشر (ثواني):</label>
          <input type="number" id="hang" value="0">
        </div>
      </div>

      <!-- زر إنشاء وتوليد الخطة -->
      <button onclick="generateAndSavePlan()" class="btn-primary">
        🚀 إنشاء / تحديث الخطة التدريبية
      </button>
    </div>

    <!-- مكان عرض الخطة الناتجة (يحتوي أزرار الطباعة والنسخ) -->
    <div id="planOutput" class="hidden"></div>

    <!-- أرشيف الخطط المحفوظة محلياً -->
    <div class="archive-section">
      <h2>📂 أرشيف الخطط المحفوظة محلياً</h2>
      <div id="plansList">
        <p class="empty-msg">لا توجد خطط محفوظة حالياً.</p>
      </div>
    </div>

  </div>

  <!-- ربط ملف الجافاسكريبت مع رقم إصدار لتجاوز الكاش -->
  <script src="script.js?v=2"></script>
</body>
</html>
